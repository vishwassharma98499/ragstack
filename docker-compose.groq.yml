version: '3.9'

# Groq mode - no Ollama, uses Groq cloud API
# Usage: docker compose -f docker-compose.groq.yml up --build
# Requires: GROQ_API_KEY in backend/.env

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rag_backend
    env_file:
      - ./backend/.env
    environment:
      - USE_GROQ=true
      - CHROMA_PERSIST_DIR=/data/chroma
      - UPLOAD_DIR=/data/uploads
    volumes:
      - rag_data:/data
      - ./backend/demo_pdfs:/app/demo_pdfs:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rag_frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  rag_data:
    name: rag_app_data_groq
